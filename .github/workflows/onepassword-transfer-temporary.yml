name: Temporary encrypted 1Password transfer
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/onepassword-transfer-temporary.yml']
permissions:
  contents: read
jobs:
  encrypted-transfer:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/github-secret-vault-transfer-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt explicitly inventoried secrets for the shared vault
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TRANSFER_VALUE_0: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          TRANSFER_VALUE_1: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          TRANSFER_VALUE_2: ${{ secrets.HEVEL_PAT }}
          TRANSFER_VALUE_3: ${{ secrets.RAILWAY_API_TOKEN }}
          TRANSFER_VALUE_4: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, tempfile
          entries = [{'scope': 'repository', 'owner': 'HEVEL-GROUP/Gear-PRO', 'name': 'EXPO_PUBLIC_SUPABASE_ANON_KEY'}, {'scope': 'repository', 'owner': 'HEVEL-GROUP/Gear-PRO', 'name': 'EXPO_PUBLIC_SUPABASE_URL'}, {'scope': 'organization', 'owner': 'HEVEL-GROUP', 'name': 'HEVEL_PAT'}, {'scope': 'organization', 'owner': 'HEVEL-GROUP', 'name': 'RAILWAY_API_TOKEN'}, {'scope': 'organization', 'owner': 'HEVEL-GROUP', 'name': 'SUPABASE_ACCESS_TOKEN'}]
          for i, entry in enumerate(entries):
              value = os.environ.get('TRANSFER_VALUE_' + str(i), '')
              if not value:
                  raise SystemExit('An inventoried credential is unavailable; transfer stopped')
              entry['value'] = value
          payload = json.dumps({'repository': os.environ['GITHUB_REPOSITORY'], 'runId': os.environ['GITHUB_RUN_ID'], 'head': os.environ['EXPECTED_HEAD'], 'entries': entries}).encode()
          with tempfile.TemporaryDirectory() as directory:
              cert = pathlib.Path(directory) / 'recipient.pem'
              cert.write_text('-----BEGIN CERTIFICATE-----\nMIIENzCCAp+gAwIBAgIUC0ufq4CfSfqDXiXi2eeju3/Bg9QwDQYJKoZIhvcNAQEL\nBQAwKzEpMCcGA1UEAwwgSEVWRUwgc2VjcmV0IHRyYW5zZmVyIDIwMjYtMTAtMjIw\nHhcNMjYxMDIyMjA0NjU3WhcNMjYxMDI0MjA0NjU3WjArMSkwJwYDVQQDDCBIRVZF\nTCBzZWNyZXQgdHJhbnNmZXIgMjAyNi0xMC0yMjCCAaIwDQYJKoZIhvcNAQEBBQAD\nggGPADCCAYoCggGBALYOJVUf0OEhUVrALd/5BETEyYt2vGRGQJSbyZfan9X37Y3O\nyt2mKZ4IY/R3iHHSKUXPRHzFvqWZmLPgHZfXX2hG/YhdVCwt0h4nKc7+T6t5T1pW\nXj6C0nvVoeyeTcrq5AqdX+YJYqnS4I8PiBudQVeYttLnIJuYvZMQizC0s7i+mQtH\nWKKm9NQgkFOVnRS4spY1qNPYhKZHkBFZGLxk849NV9DG06Qeco3RsyueZInYmpcR\nlpbtK6kSjt4GcyXZWApdZKx/9+/jmZCIibdvOn2/Ixkh8k22BtKs6tHbfIOFxGea\ngu81VWg5qsB8IsN3sgkr9tXF7YOO6yjupSNB3alyxTAQIWLgll+VUlaWl3lC7ikZ\nM3n8O9q/bidzHGgmlVPavUYaKbNg7jDbniwxRhcrto1B6ohmAuHpjD3vSC/P2RM1\nx+5Qup6QXsI5iVefzjxPy3co3llOyn2JLYF//eZdH6C/fJJwDXe3bE91TvZ/3ezD\nk78YraOGRSNP2MoUcwIDAQABo1MwUTAdBgNVHQ4EFgQUkYOxZ56vOhg5x7h1A7wV\nCkiUMrMwHwYDVR0jBBgwFoAUkYOxZ56vOhg5x7h1A7wVCkiUMrMwDwYDVR0TAQH/\nBAUwAwEB/zANBgkqhkiG9w0BAQsFAAOCAYEAXceCQGAI+jFJWMFlkruO+nM5tSvV\n21PY6kFuj5GJpXOriPnxgpZD+I2LXCnN9aEt8tMMqoq4dIHDMhXi0Hzhb+VxnJb/\nS/Qm+0699zqIeCAPPhaZAEom8AVkUqpledMV0rUZ571f/MzhM3KBhMqV82sa32Lb\nTsewEwNbU+kp4JaBujq7OPD0dqQBipOIxN3J9WTu8PfFlfm4oL3Xfq9aID98eTwG\nzV7k9nJIj7W6ui3p08umKw8J5LMxUDp5G0r/eKwWX7SDE+kVDBOBfC6eUbTrnUbv\nI6A2V9nv95cdJciYY6Dtkr2Nvyl4sEckC50H7op7CecDiEhn97+1X+sta/JEKobL\nj7VVo7R5GnSf6x09M9xJfkS1dO6BUYI82RUF55lEsEaaZXftWedAgmDZJsmvpuuS\nD9LGsM0UF0JWdZEqhO+6XyHDqCS8MB+kjXbqSN0Sgxr1vK8FvhSU8dSWqqNWPkVU\nwnhkGeVORQFRFuJXwWAnPm1EW4v2xA1tbDaj\n-----END CERTIFICATE-----\n')
              result = subprocess.run(['openssl', 'cms', '-encrypt', '-aes-256-gcm', '-binary', '-outform', 'DER', str(cert)], input=payload, capture_output=True)
              if result.returncode:
                  raise SystemExit('Authenticated encryption failed; no plaintext exported')
              pathlib.Path('encrypted-secrets.cms').write_bytes(result.stdout)
          print('Encrypted transfer prepared; no plaintext artifact or secret log output')
          PYTHON
      - name: Upload authenticated ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onepassword-encrypted-transfer
          path: encrypted-secrets.cms
          retention-days: 1
          if-no-files-found: error
